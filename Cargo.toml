[workspace]
resolver = "2"
members = [
    "crates/auth2api-core",
    "crates/auth2api-cli",
    "desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/leonardoshen/auth2api"

[workspace.dependencies]
auth2api-core = { path = "crates/auth2api-core" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
futures-util = "0.3"
async-stream = "0.3"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
directories = "5"
open = "5"
url = "2"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
if-addrs = "0.13"

[profile.release]
# The desktop bundle ships this binary; the size and speed both matter more
# than incremental rebuild time here.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
