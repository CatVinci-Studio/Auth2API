[package]
name = "auth2api-desktop"
description = "Auth2API desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Tauri builds the app logic as a library so the same code can be reused by
# the mobile targets; `main.rs` is only a launcher.
name = "auth2api_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
auth2api-core = { workspace = true }
tauri = { version = "2", features = [] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
if-addrs = { workspace = true }
